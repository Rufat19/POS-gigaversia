<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Açıq qalanlar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=20260904-rb19">
  </head>
  <body>
    <div class="page-header">
      <div class="page-title brand-header">
        <div class="brand-mark">RB19</div>
        <p class="page-subtitle">Açıq sifarişlər və borc tarixçəsi</p>
      </div>
      <div class="page-actions">
        <div class="lang-switcher" aria-label="Dil seçimi">
          <label class="lang-select-wrap" for="open-orders-lang-select">
            <span class="sr-only">Dil</span>
            <select id="open-orders-lang-select" class="lang-select" aria-label="Dil seçimi">
              <option value="az">Aze</option>
              <option value="en">Eng</option>
              <option value="ru">Rus</option>
              <option value="tr">Tur</option>
            </select>
          </label>
        </div>
        <nav class="page-nav">
          <a href="/" class="nav-products">Məhsullar</a>
          <a href="/open-orders" class="active nav-open-orders">Açıq qalanlar</a>
          {% if session.get('role') == 'manager' %}
            <a href="/operations" class="nav-operations">Əməliyyatlar</a>
            <a href="/reports" class="nav-reports">Hesabatlar</a>
          {% endif %}
        </nav>
        <div class="user-chip">
          <span class="role-label">{{ 'Müdir' if session.get('role') == 'manager' else 'Satıcı' }}</span>
          <a href="{{ url_for('logout') }}" class="logout-link">Çıxış</a>
        </div>
      </div>
    </div>
    <main class="container open-orders-page">
      <section>
        <div class="open-orders-heading">
          <h1 class="open-orders-title">Açıq qalanlar</h1>
          <a class="btn primary back-products" href="/">Məhsullara qayıt</a>
        </div>
        <div id="open-orders-list" class="credit-orders-grid"></div>
      </section>
      <section class="paid-orders-section">
        <h2 class="paid-history-title">Borc tarixçəsi</h2>
        <div id="paid-orders-list" class="credit-orders-grid"></div>
      </section>
    </main>
    <script>
      const currentRole = '{{ "manager" if session.get("role") == "manager" else "seller" }}';
      const translations = {
        az: {
          products: 'Məhsullar', openOrders: 'Açıq qalanlar', operations: 'Əməliyyatlar',
          reports: 'Hesabatlar', manager: 'Müdir', seller: 'Satıcı', logout: 'Çıxış',
          title: 'Açıq qalanlar', back: 'Məhsullara qayıt', history: 'Borc tarixçəsi',
          paid: 'Ödənilib', paidAmount: 'Ödənilən', total: 'Ümumi', remaining: 'Qalıq',
          addProduct: 'Məhsul əlavə et', partialPayment: 'Hissəli ödəniş',
          noOpen: 'Açıq sifariş yoxdur.', noHistory: 'Borc tarixçəsi boşdur.',
          paymentPrompt: 'Ödənilən məbləği yazın (AZN):', invalidPayment: 'Düzgün ödəniş məbləği yazın.',
          paymentFailed: 'Ödəniş qeydə alınmadı.', loadFailed: 'Sifarişlər yüklənmədi.'
        },
        en: {
          products: 'Products', openOrders: 'Open orders', operations: 'Operations',
          reports: 'Reports', manager: 'Manager', seller: 'Seller', logout: 'Logout',
          title: 'Open orders', back: 'Back to products', history: 'Credit history',
          paid: 'Paid', paidAmount: 'Paid', total: 'Total', remaining: 'Remaining',
          addProduct: 'Add products', partialPayment: 'Partial payment',
          noOpen: 'No open orders.', noHistory: 'Credit history is empty.',
          paymentPrompt: 'Enter payment amount (AZN):', invalidPayment: 'Enter a valid payment amount.',
          paymentFailed: 'Payment was not recorded.', loadFailed: 'Orders could not be loaded.'
        },
        ru: {
          products: 'Товары', openOrders: 'Открытые заказы', operations: 'Операции',
          reports: 'Отчеты', manager: 'Менеджер', seller: 'Продавец', logout: 'Выход',
          title: 'Открытые заказы', back: 'К товарам', history: 'История долгов',
          paid: 'Оплачено', paidAmount: 'Оплачено', total: 'Всего', remaining: 'Остаток',
          addProduct: 'Добавить товары', partialPayment: 'Частичная оплата',
          noOpen: 'Нет открытых заказов.', noHistory: 'История долгов пуста.',
          paymentPrompt: 'Введите сумму оплаты (AZN):', invalidPayment: 'Введите корректную сумму.',
          paymentFailed: 'Платеж не записан.', loadFailed: 'Не удалось загрузить заказы.'
        },
        tr: {
          products: 'Ürünler', openOrders: 'Açık siparişler', operations: 'İşlemler',
          reports: 'Raporlar', manager: 'Yönetici', seller: 'Satıcı', logout: 'Çıkış',
          title: 'Açık siparişler', back: 'Ürünlere dön', history: 'Borç geçmişi',
          paid: 'Ödendi', paidAmount: 'Ödenen', total: 'Toplam', remaining: 'Kalan',
          addProduct: 'Ürün ekle', partialPayment: 'Kısmi ödeme',
          noOpen: 'Açık sipariş yok.', noHistory: 'Borç geçmişi boş.',
          paymentPrompt: 'Ödeme tutarını yazın (AZN):', invalidPayment: 'Geçerli bir ödeme tutarı yazın.',
          paymentFailed: 'Ödeme kaydedilmedi.', loadFailed: 'Siparişler yüklenemedi.'
        }
      };
      let currentLang = localStorage.getItem('pos_lang') || 'az';
      function t(key){ return (translations[currentLang] || translations.az)[key] || key; }
      function applyLanguage(lang){
        currentLang = translations[lang] ? lang : 'az';
        const dict = translations[currentLang];
        document.querySelector('.nav-products').textContent = dict.products;
        document.querySelector('.nav-open-orders').textContent = dict.openOrders;
        const operationsLink = document.querySelector('.nav-operations');
        const reportsLink = document.querySelector('.nav-reports');
        if (operationsLink) operationsLink.textContent = dict.operations;
        if (reportsLink) reportsLink.textContent = dict.reports;
        document.querySelector('.role-label').textContent = currentRole === 'manager' ? dict.manager : dict.seller;
        document.querySelector('.logout-link').textContent = dict.logout;
        document.querySelector('.open-orders-title').textContent = dict.title;
        document.querySelector('.back-products').textContent = dict.back;
        document.querySelector('.paid-history-title').textContent = dict.history;
        document.getElementById('open-orders-lang-select').value = currentLang;
        document.documentElement.lang = currentLang;
        localStorage.setItem('pos_lang', currentLang);
      }
      function orderCard(order, isPaid){
        const items=order.items.map(item=>`<li>${item.name} × ${item.quantity}<strong>${item.line_total.toFixed(2)} AZN</strong></li>`).join('');
        const action=isPaid
          ? `<span class="paid-badge">${t('paid')} · ${order.total_amount.toFixed(2)} AZN</span>`
          : `<div class="credit-order-actions"><a class="btn primary" href="/?credit_order=${order.id}">${t('addProduct')}</a><button class="btn pay-btn" onclick="payOrder(${order.id})">${t('partialPayment')}</button></div>`;
        const paymentInfo=isPaid
          ? `<div class="payment-info">${t('paidAmount')}: ${order.paid_amount.toFixed(2)} AZN</div>`
          : `<div class="payment-info">${t('total')}: ${order.total_amount.toFixed(2)} AZN · ${t('paidAmount')}: ${order.paid_amount.toFixed(2)} AZN · ${t('remaining')}: <strong>${order.remaining_amount.toFixed(2)} AZN</strong></div>`;
        return `<article class="credit-order-card"><div class="credit-order-top"><div><h3>${escapeHtml(order.customer_name)}</h3><small>${order.created_at}</small></div><strong class="credit-total">${order.remaining_amount.toFixed(2)} AZN</strong></div>${paymentInfo}<ul>${items}</ul>${action}</article>`;
      }
      function escapeHtml(value){ return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch])); }
      async function loadOrders(){
        const response=await fetch('/api/credit-orders');
        const result=await response.json();
        if(!response.ok) throw new Error(result.message || t('loadFailed'));
        const open=result.orders.filter(order=>order.status==='open');
        const paid=result.orders.filter(order=>order.status==='paid');
        document.getElementById('open-orders-list').innerHTML=open.length ? open.map(order=>orderCard(order,false)).join('') : `<p class="empty-state">${t('noOpen')}</p>`;
        document.getElementById('paid-orders-list').innerHTML=paid.length ? paid.map(order=>orderCard(order,true)).join('') : `<p class="empty-state">${t('noHistory')}</p>`;
      }
      async function payOrder(orderId){
        const amount=window.prompt(t('paymentPrompt'));
        if(amount===null) return;
        const parsed=Number(amount.replace(',', '.'));
        if(!Number.isFinite(parsed) || parsed<=0){ alert(t('invalidPayment')); return; }
        const response=await fetch(`/api/credit-orders/${orderId}/pay`,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({amount:parsed})
        });
        const result=await response.json();
        if(!response.ok){ alert(result.message || t('paymentFailed')); return; }
        loadOrders().catch(error=>alert(error.message));
      }
      document.getElementById('open-orders-lang-select').addEventListener('change', (event) => {
        applyLanguage(event.target.value);
        loadOrders().catch(error=>alert(error.message));
      });
      applyLanguage(currentLang);
      loadOrders().catch(error=>{
        document.getElementById('open-orders-list').innerHTML=`<p class="error-state">${escapeHtml(error.message)}</p>`;
      });
    </script>
  </body>
</html>
