<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POS - Giriş</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}?v=20260904-rb19">
    <style>
      /* moved inline styles from .lang-switcher element to avoid inline styling */
      .lang-switcher.lang-switcher-login { margin: 0 auto 18px; justify-content: center; }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-card">
        <div class="lang-switcher lang-switcher-login" aria-label="Dil seçimi">
          <label class="lang-select-wrap" for="login-lang-select">
            <span class="sr-only">Dil</span>
            <select id="login-lang-select" class="lang-select" aria-label="Dil seçimi">
              <option value="az">Aze</option>
              <option value="en">Eng</option>
              <option value="ru">Rus</option>
              <option value="tr">Tur</option>
            </select>
          </label>
        </div>

        <h1 data-i18n="common.pos">POS</h1>
        <p data-i18n="login.title">İstifadəçi kodunu daxil edin</p>

        <form method="post" action="{{ url_for('login_page') }}" class="login-form">
          <input
            class="pin-input"
            type="password"
            name="pin"
            inputmode="numeric"
            maxlength="6"
            pattern="[0-9]*"
            placeholder="••••••"
            aria-label="PIN"
            autocomplete="one-time-code"
            data-i18n-placeholder="login.pinPlaceholder"
            required
          >

          <div class="pin-actions">
            <div class="pin-keypad" aria-label="PIN keypad">
              <button type="button" class="key-btn" data-value="1">1</button>
              <button type="button" class="key-btn" data-value="2">2</button>
              <button type="button" class="key-btn" data-value="3">3</button>
              <button type="button" class="key-btn" data-value="4">4</button>
              <button type="button" class="key-btn" data-value="5">5</button>
              <button type="button" class="key-btn" data-value="6">6</button>
              <button type="button" class="key-btn" data-value="7">7</button>
              <button type="button" class="key-btn" data-value="8">8</button>
              <button type="button" class="key-btn" data-value="9">9</button>
              <button type="button" class="key-btn" data-action="clear" data-i18n="login.clear">Sil</button>
              <button type="button" class="key-btn" data-value="0">0</button>
              <button type="submit" class="key-btn submit" data-i18n="login.submit">Giriş</button>
            </div>
          </div>

          <div class="login-alert" aria-live="polite">{{ error or '' }}</div>
          <div class="login-hint" data-i18n="login.hint">Satıcı və müdir üçün giriş</div>
        </form>
      </div>
    </div>

    <script>
      const translations = {
        az: {
          'common.pos': 'POS',
          'login.title': 'İstifadəçi kodunu daxil edin',
          'login.pinPlaceholder': '••••••',
          'login.clear': 'Sil',
          'login.submit': 'Giriş',
          'login.hint': 'Satıcı, müdir və admin üçün giriş'
        },
        en: {
          'common.pos': 'POS',
          'login.title': 'Enter user code',
          'login.pinPlaceholder': '••••••',
          'login.clear': 'Clear',
          'login.submit': 'Login',
          'login.hint': 'Seller, manager and admin sign-in'
        },
        ru: {
          'common.pos': 'POS',
          'login.title': 'Введите код пользователя',
          'login.pinPlaceholder': '••••••',
          'login.clear': 'Сброс',
          'login.submit': 'Войти',
          'login.hint': 'Вход для продавца, менеджера и администратора'
        },
        tr: {
          'common.pos': 'POS',
          'login.title': 'Kullanıcı kodunu girin',
          'login.pinPlaceholder': '••••••',
          'login.clear': 'Temizle',
          'login.submit': 'Giriş',
          'login.hint': 'Satıcı, yönetici ve admin girişi'
        }
      };

      let currentLang = localStorage.getItem('pos_lang') || 'az';
      const pinInput = document.querySelector('.pin-input');

      function applyLanguage(lang) {
        currentLang = lang in translations ? lang : 'az';
        const dict = translations[currentLang];
        document.querySelectorAll('[data-i18n]').forEach((el) => {
          if (dict[el.dataset.i18n] !== undefined) {
            el.textContent = dict[el.dataset.i18n];
          }
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach((el) => {
          if (dict[el.dataset.i18nPlaceholder] !== undefined) {
            el.placeholder = dict[el.dataset.i18nPlaceholder];
          }
        });
        const langSelect = document.getElementById('login-lang-select');
        if (langSelect) {
          langSelect.value = currentLang;
        }
        localStorage.setItem('pos_lang', currentLang);
        document.documentElement.lang = currentLang;
      }

      const languageSelector = document.getElementById('login-lang-select');
      if (languageSelector) {
        languageSelector.addEventListener('change', (event) => applyLanguage(event.target.value));
      }

      document.querySelectorAll('.key-btn').forEach(button => {
        button.addEventListener('click', () => {
          const action = button.dataset.action;
          const value = button.dataset.value;

          if (action === 'clear') {
            pinInput.value = '';
            pinInput.focus();
            return;
          }

          if (!value) return;
          if (pinInput.value.length >= 6) return;
          pinInput.value += value;
          pinInput.focus();
        });
      });

      applyLanguage(currentLang);
    </script>
  </body>
</html>
