<!doctype html>
<html lang="az">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Əməliyyatlar - Anbar hərəkətləri</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <header style="display:flex;align-items:center;gap:12px;padding:12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.03)">
      <a href="/">POS</a>
      <h2>Əməliyyatlar</h2>
    </header>

    <div style="max-width:1100px;margin:18px auto;padding:12px">
      <div style="display:flex;gap:20px;flex-wrap:wrap">
        <div style="flex:1;min-width:320px;background:#fff;padding:12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.03)">
          <h3>Daxilolma / İtki əlavə et</h3>
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">
            <select id="mov-product">
              {% for p in products %}
                <option value="{{ p[0] }}">{{ p[1] }}</option>
              {% endfor %}
            </select>
            <select id="mov-type">
              <option value="daxilolma">Daxilolma</option>
              <option value="itki">İtki</option>
            </select>
            <input id="mov-qty" type="number" min="1" value="1" placeholder="Miqdar">
            <input id="mov-note" placeholder="Qeyd (istəyə bağlı)">
            <div style="display:flex;gap:8px">
              <button id="mov-add" class="add-btn">Əlavə et</button>
              <div id="mov-msg" style="align-self:center;color:#666"></div>
            </div>
          </div>
        </div>

        <div style="flex:2;min-width:420px;background:#fff;padding:12px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,0.03)">
          <h3>Tam tarixçə</h3>
          <table style="width:100%;border-collapse:collapse">
            <thead>
              <tr>
                <th style="text-align:left;padding:8px;border-bottom:1px solid #eee">Tarix</th>
                <th style="text-align:left;padding:8px;border-bottom:1px solid #eee">Məhsul</th>
                <th style="text-align:left;padding:8px;border-bottom:1px solid #eee">Növ</th>
                <th style="text-align:right;padding:8px;border-bottom:1px solid #eee">Miqdar</th>
                <th style="text-align:right;padding:8px;border-bottom:1px solid #eee">Məbləğ</th>
              </tr>
            </thead>
            <tbody id="history-body">
              {% for row in history %}
                <tr>
                  <td style="padding:8px;vertical-align:top">{{ row[0] }}</td>
                  <td style="padding:8px;vertical-align:top">{{ row[1] }}</td>
                  <td style="padding:8px;vertical-align:top" class="kind-{{ row[2] }}">{{ row[2] }}</td>
                  <td style="padding:8px;vertical-align:top;text-align:right">{{ row[3] }}</td>
                  <td style="padding:8px;vertical-align:top;text-align:right">{{ row[4] if row[4] is not none else '' }}</td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      document.getElementById('mov-add').addEventListener('click', async ()=>{
        const product_id = document.getElementById('mov-product').value;
        const type = document.getElementById('mov-type').value;
        const quantity = Number(document.getElementById('mov-qty').value || 0);
        const note = document.getElementById('mov-note').value || '';
        const msg = document.getElementById('mov-msg');
        if(!product_id || quantity <= 0){ msg.textContent='Məhsul və müsbət miqdar seçin'; return; }
        msg.textContent='Əlavə edilir...';
        try{
          const res = await fetch('/operations/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product_id, type, quantity, note})});
          const data = await res.json();
          if(!res.ok) throw new Error(data.message||'Xəta');
          msg.textContent='Uğurla əlavə olundu.';
          setTimeout(()=>location.reload(),500);
        }catch(e){ msg.textContent='Xəta: '+e.message; }
      });
    </script>
  </body>
</html>
