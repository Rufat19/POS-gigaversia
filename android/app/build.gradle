plugins {
    id 'com.android.application'
}

android {
    namespace 'az.robo.pos'
    compileSdk 36

    defaultConfig {
        applicationId 'az.robo.pos'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.13.0'
}
